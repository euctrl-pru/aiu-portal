{{ define "main" }}
<style type="text/css">
.pub-section {
  margin-bottom: 3rem;
}
.pub-section-header {
  display: flex;
  align-items: center;
  margin-bottom: 1.5rem;
  padding-bottom: 0.75rem;
  border-bottom: 2px solid #003366;
}
.pub-section-header i {
  font-size: 1.5rem;
  color: #003366;
  margin-right: 0.75rem;
}
.pub-section-header h2 {
  font-size: 1.5rem;
  font-weight: 600;
  color: #003366;
  margin: 0;
}
.pub-card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 1.5rem;
}
.pub-card {
  border: none;
  border-radius: 1rem;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  height: 100%;
}
.pub-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
}
.pub-card a {
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  height: 100%;
}
.pub-card .card-img-top {
  border-radius: 0;
  object-fit: cover;
  aspect-ratio: 4 / 3;
  width: 100%;
}
.pub-card .card-body {
  padding: 1rem 1.1rem;
  flex: 1;
  display: flex;
  flex-direction: column;
}
.pub-card .card-title {
  font-size: 0.95rem;
  font-weight: 600;
  color: #1a1a2e;
  margin-bottom: 0.4rem;
}
.pub-card .card-text {
  font-size: 0.82rem;
  color: #6c757d;
  line-height: 1.4;
  margin: 0;
}
.pub-card .external-badge {
  display: inline-block;
  font-size: 0.7rem;
  color: #6c757d;
  margin-top: auto;
  padding-top: 0.5rem;
}
.pub-card .external-badge i {
  margin-left: 0.2rem;
}
</style>

<main>
<div class="container" style="margin-top: 2rem;">
{{ range .Site.Data.publications.sections }}
<div class="pub-section">
<div class="pub-section-header">
  <i class="{{ .icon }}"></i>
  <h2>{{ .title }}</h2>
</div>
<div class="pub-card-grid">
{{ range .cards }}
<div class="pub-card card">
<a href="{{ .url }}"{{ if .external }} target="_blank"{{ end }}>
<img class="card-img-top" src="{{ .image }}" alt="{{ .title }}">
<div class="card-body">
<h5 class="card-title">{{ .title }}</h5>
<p class="card-text">{{ .description }}</p>
{{ if .external }}<span class="external-badge">eurocontrol.int <i class="fas fa-external-link-alt"></i></span>{{ end }}
</div>
</a>
</div>
{{ end }}
</div>
</div>
{{ end }}
</div>
</main>
{{ end }}
