name: Update publications

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only, do not commit'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/pubsync/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/pubsync/requirements.txt

      - name: Run tests
        run: pytest scripts/pubsync -q

      - name: Sync publications
        id: sync
        continue-on-error: true
        run: python -m scripts.pubsync --summary "$GITHUB_STEP_SUMMARY" ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.92.1'

      - name: Build site (gate)
        run: hugo --gc --minify

      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -n "$(git status --porcelain data static/images/auto)" ]; then
            git config user.name "pubsync-bot"
            git config user.email "pubsync-bot@users.noreply.github.com"
            git add data static/images/auto
            msg="Update publications"
            if [ -f scripts/pubsync/.last-run-keys ]; then
              msg="Update publications: $(cat scripts/pubsync/.last-run-keys)"
            fi
            git commit -m "$msg"
            git pull --rebase origin master
            git push origin HEAD:master
          else
            echo "No changes to commit"
          fi

      - name: Fail if sync reported errors
        if: steps.sync.outcome == 'failure'
        run: exit 1
