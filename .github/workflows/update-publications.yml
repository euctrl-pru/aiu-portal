name: Update publications

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only, do not commit'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/pubsync/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/pubsync/requirements.txt

      - name: Run tests
        run: pytest scripts/pubsync -q

      - name: Sync publications
        id: sync
        continue-on-error: true
        run: python -m scripts.pubsync --summary "$GITHUB_STEP_SUMMARY" ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.92.1'

      - name: Build site (gate)
        run: hugo --gc --minify

      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain data static/images/auto)" ]; then
            git config user.name "pubsync-bot"
            git config user.email "pubsync-bot@users.noreply.github.com"
            git add -A -- data
            # static/images/auto only exists once a series has downloaded an image
            if [ -d static/images/auto ]; then git add -A -- static/images/auto; fi
            msg="Update publications"
            if [ -f scripts/pubsync/.last-run-keys ]; then
              msg="Update publications: $(cat scripts/pubsync/.last-run-keys)"
            fi
            git commit -m "$msg"
            # The repository is public, so the pull needs no credentials; only the push does.
            # Anything else the run left modified (build output, eol normalisation) is not ours to commit:
            # log it, keep it out of the commit, and let the rebase stash it.
            git status --porcelain
            git pull --rebase --autostash origin master
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:master
          else
            echo "No changes to commit"
          fi

      - name: Fail if sync reported errors
        if: steps.sync.outcome == 'failure'
        run: exit 1
