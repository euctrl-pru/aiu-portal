{{ if not .Site.IsServer }}
  {{ with .Site.GoogleAnalytics }}
  <script>
    (function () {
      var GA_ID = '{{ . }}';
      var loaded = false;

      window.aiuLoadGA = function () {
        if (loaded) { return; }
        loaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', GA_ID);
      };

      var parts = ('; ' + document.cookie).split('; aiu_cookie_consent=');
      var consent = parts.length >= 2 ? parts.pop().split(';').shift() : null;
      if (consent === 'granted') { window.aiuLoadGA(); }
    })();
  </script>
  {{ end }}
{{ end }}
